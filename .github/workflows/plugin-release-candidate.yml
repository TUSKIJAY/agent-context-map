name: Plugin Release Candidate

on:
  pull_request:
  push:
    branches:
      - codex/acm-pluginization-plan
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON: python

concurrency:
  group: plugin-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-gate:
    name: ${{ matrix.os }} / Node 24.12.0
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.5
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install Python validator dependency
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - name: Verify toolchain
        run: |
          node --version
          npm --version
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Core, MCP, Widget, and project-store tests
        run: npm run test:all
      - name: Desktop web build
        run: npm run build
      - name: Build fixed plugin candidate
        run: npm run build:plugin
      - name: Verify fixed plugin candidate
        run: node plugins/agent-context-map/scripts/verify-release.mjs dist/agent-context-map-plugin --expected-version 0.3.0-rc.1
      - name: Distribution and reproducibility gates
        run: |
          npm run test:distribution
          npm run test:mcp-bundle-repro
      - name: Isolated lifecycle gates
        run: |
          npm run test:install-upgrade-rollback
          npm run test:uninstall-reinstall
      - name: Upload fixed release candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: agent-context-map-plugin-0.3.0-rc.1
          path: dist/agent-context-map-plugin
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  artifact-audit:
    name: Downloaded release artifact integrity
    needs: platform-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@v8
        with:
          name: agent-context-map-plugin-0.3.0-rc.1
          path: artifact/agent-context-map-plugin
      - name: Verify downloaded installable artifact
        run: node plugins/agent-context-map/scripts/verify-release.mjs artifact/agent-context-map-plugin --expected-version 0.3.0-rc.1

  clean-room:
    name: Clean-room package replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.5
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install Python validator dependency
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - name: Bootstrap checker
        run: npm ci --no-audit --no-fund
      - name: Rebuild from an isolated source copy
        run: npm run test:clean-room
