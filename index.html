<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Context Map · Visual Spec Viewer</title>
  <style>
    :root {
      --sans: system-ui, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      background: #fff; overscroll-behavior: none; }
    #root { height: 100%; }
    button { font-family: var(--sans); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #d7dbe2; border-radius: 9px; border: 2px solid #fff; }
    ::-webkit-scrollbar-thumb:hover { background: #c2c8d2; }
    ::-webkit-scrollbar-track { background: transparent; }
    select { font-family: var(--sans); }
    input[type="range"] { height: 18px; }
    .acm-handle { opacity: 0; transition: opacity .12s; }
    .acm-node:hover .acm-handle { opacity: 1; }
    .acm-node:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
